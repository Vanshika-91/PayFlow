services:
  - type: web
    name: payflow-api
    runtime: docker
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: payflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: payflow-db
          property: password
      - key: PAYFLOW_API_KEY
        generateValue: true
databases:
  - name: payflow-db
    plan: basic-256mb
    databaseName: payflow
    user: payflow
