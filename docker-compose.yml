services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/payflow
      DB_USERNAME: payflow
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      PAYFLOW_API_KEY: ${PAYFLOW_API_KEY:?Set PAYFLOW_API_KEY in environment}
      PORT: 8080
volumes:
  postgres_data:
